l_english:
 escann_knight_banner:0 "Escann Knight"
 escann_knight_bannerDESCR:0 "Heavy cavalry of the knightly orders of Escann, sworn to the crown and bound to the chivalric traditions of the old kingdom."
 escann_foot_banner:0 "Escann Foot Knight"
 escann_foot_bannerDESCR:0 "Dismounted knights who hold the line with shield and blade when the charge is spent."
 escann_knights_reform:0 "Restored Knight Kingdom"
 escann_knights_reform_desc:0 "The realm is rebuilt around the old chivalric orders. Knights are granted land and privilege in exchange for service, and the crown may call upon them in times of war."